<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Княгининский университет — Викторина ко Дню космонавтики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══════════ SPLASH ═══════════ -->
  <div id="splash">
    <div class="splash-stars" id="splashStars"></div>
    <div class="splash-nebula"></div>

    <div class="splash-planet sp-earth"></div>
    <div class="splash-planet sp-mars"></div>
    <div class="splash-planet sp-saturn"></div>
    <div class="splash-planet sp-moon"></div>
    <div class="splash-planet sp-jupiter"></div>

    <div class="sp-rocket sp-rocket--1">🚀</div>
    <div class="sp-rocket sp-rocket--2">🚀</div>

    <div class="sp-shoot sp-shoot--1"></div>
    <div class="sp-shoot sp-shoot--2"></div>
    <div class="sp-shoot sp-shoot--3"></div>

    <div class="splash-content">
      <div class="splash-badge">12 апреля — День космонавтики</div>
      <h1 class="splash-title">Княгининский<br>университет</h1>
      <p class="splash-sub">Викторина о космосе и тех, кто его покорял</p>

      <div class="splash-fact-wrap">
        <div class="splash-fact" id="splashFact">
          <span class="splash-fact-label">Знаете ли вы?</span>
          <span id="factText"></span>
        </div>
      </div>

      <button class="splash-launch" id="launchBtn">
        <span class="launch-text">Поехали!</span>
        <span class="launch-rocket"></span>
      </button>
    </div>
  </div>

  <!-- ═══════════ TRANSITION ROCKET ═══════════ -->
  <div id="transition" class="transition">
    <div class="transition-rocket">🚀</div>
    <div class="transition-trail"></div>
    <div class="transition-flash"></div>
  </div>

  <!-- ═══════════ GAME ═══════════ -->
  <div id="game-area">
    <div class="game-bg-stars" id="gameStars"></div>
    <div class="game-nebula"></div>

    <div class="game-planet gp-earth"></div>
    <div class="game-planet gp-small"></div>
    <div class="game-planet gp-saturn"></div>

    <div class="game-rocket gr--1">🚀</div>
    <div class="game-rocket gr--2">🚀</div>

    <div class="game-shoot gs--1"></div>
    <div class="game-shoot gs--2"></div>

    <main class="app">
      <header class="hero">
        <div class="hero__badge">12 апреля — День космонавтики</div>
        <h1 class="hero__title">Княгининский университет</h1>
        <p class="hero__sub">Викторина о космосе и тех, кто его покорял</p>
        <div class="hero__divider">✦ ✧ ✦</div>
      </header>

      <section id="teams-section" class="panel teams-panel"></section>
      <section id="board-section" class="panel board-panel"></section>
      <section id="question-overlay" class="question-overlay hidden"></section>
      <section id="final-section" class="panel final-panel hidden"></section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="splash.js"></script>
  <script src="game.js"></script>
</body>
</html>
