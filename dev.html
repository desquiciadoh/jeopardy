<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Своя Игра — День Космонавтики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #060a18;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e0e4ee;
      --muted: rgba(180, 195, 225, 0.55);
      --gold: #e8c44a;
      --gold-2: #d4a520;
      --cyan: #5cc8e0;
      --purple: #8a6cd9;
      --pink: #d45aa8;
      --green: #27d67a;
      --red: #e85568;
      --star-blue: #6eadd4;
      --nebula: #6a50b8;
      --rocket-orange: #c87040;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --radius: 22px;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--bg-1);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════════
       SPLASH SCREEN
       ══════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-1);
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Splash starfield */
    .splash-stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .splash-stars .s-star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: s-twinkle var(--dur) ease-in-out infinite alternate;
    }

    @keyframes s-twinkle {
      0% { opacity: var(--mop); }
      100% { opacity: 1; }
    }

    /* Splash nebula */
    .splash-nebula {
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.55;
      background:
        radial-gradient(ellipse 600px 450px at 20% 25%, rgba(106, 80, 184, 0.35), transparent),
        radial-gradient(ellipse 500px 350px at 80% 30%, rgba(40, 100, 200, 0.30), transparent),
        radial-gradient(ellipse 550px 300px at 50% 75%, rgba(200, 112, 64, 0.20), transparent),
        radial-gradient(ellipse 300px 300px at 65% 55%, rgba(92, 200, 224, 0.12), transparent);
    }

    /* Splash planets */
    .splash-planet {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .sp-earth {
      width: 280px;
      height: 280px;
      bottom: -80px;
      left: -60px;
      background: radial-gradient(circle at 38% 35%, #62b8e0, #2a6a9a 45%, #1a4a7a 75%);
      box-shadow: 0 0 80px rgba(60, 150, 220, 0.25), inset -40px -20px 50px rgba(0,0,0,0.25);
      opacity: 0.6;
      animation: sp-float 16s ease-in-out infinite;
    }

    .sp-mars {
      width: 120px;
      height: 120px;
      top: 8%;
      right: 8%;
      background: radial-gradient(circle at 38% 35%, #e0956a, #a05a30 55%, #7a3a18 80%);
      box-shadow: 0 0 45px rgba(200, 100, 50, 0.20), inset -15px -10px 20px rgba(0,0,0,0.20);
      opacity: 0.55;
      animation: sp-float 22s ease-in-out infinite reverse;
    }

    .sp-saturn {
      width: 160px;
      height: 160px;
      top: 35%;
      left: 6%;
      background: radial-gradient(circle at 38% 35%, #f0d888, #c8a030 50%, #a07818 80%);
      box-shadow: 0 0 50px rgba(200, 160, 50, 0.15), inset -20px -12px 28px rgba(0,0,0,0.20);
      opacity: 0.45;
      animation: sp-float 28s ease-in-out infinite;
    }

    .sp-saturn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 240px; height: 50px;
      border: 2px solid rgba(240, 216, 136, 0.30);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-22deg);
    }

    .sp-moon {
      width: 60px;
      height: 60px;
      bottom: 18%;
      right: 12%;
      background: radial-gradient(circle at 38% 35%, #e0dcd0, #b0a890 60%);
      box-shadow: 0 0 25px rgba(200, 190, 160, 0.12);
      opacity: 0.45;
      animation: sp-float 20s ease-in-out infinite;
    }

    @keyframes sp-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Splash rockets */
    .sp-rocket {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255, 140, 60, 0.4));
    }

    .sp-rocket--1 { animation: sp-fly-1 20s linear infinite; }
    .sp-rocket--2 { animation: sp-fly-2 26s linear infinite 6s; }

    @keyframes sp-fly-1 {
      0% { bottom: -40px; left: 15%; opacity: 0; transform: rotate(-50deg) scale(1); }
      5% { opacity: 0.6; }
      85% { opacity: 0.6; }
      95% { opacity: 0; }
      100% { bottom: 110%; left: 70%; opacity: 0; transform: rotate(-50deg) scale(1.1); }
    }

    @keyframes sp-fly-2 {
      0% { bottom: -40px; right: 10%; left: auto; opacity: 0; transform: rotate(-40deg) scale(0.9); }
      4% { opacity: 0.5; }
      80% { opacity: 0.5; }
      92% { opacity: 0; }
      100% { bottom: 112%; right: 55%; left: auto; opacity: 0; transform: rotate(-40deg) scale(1.05); }
    }

    /* Shooting stars on splash */
    .sp-shoot {
      position: absolute;
      width: 2.5px; height: 2.5px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    .sp-shoot::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 70px; height: 1.5px;
      background: linear-gradient(to right, rgba(255,255,255,0.6), transparent);
      transform-origin: right center;
      transform: translateX(100%);
    }

    .sp-shoot--1 { top: 20%; left: 60%; animation: sp-shoot-anim 5s ease-in-out infinite 1s; }
    .sp-shoot--2 { top: 50%; left: 75%; animation: sp-shoot-anim 6s ease-in-out infinite 4s; }
    .sp-shoot--3 { top: 30%; left: 40%; animation: sp-shoot-anim 7s ease-in-out infinite 8s; }

    @keyframes sp-shoot-anim {
      0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
      4% { opacity: 1; }
      12% { opacity: 1; transform: translate(-200px, 120px) rotate(-35deg); }
      16% { opacity: 0; transform: translate(-260px, 150px) rotate(-35deg); }
      100% { opacity: 0; }
    }

    /* Splash content */
    .splash-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 700px;
    }

    .splash-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: rgba(200, 112, 64, 0.10);
      border: 1px solid rgba(200, 112, 64, 0.22);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rocket-orange);
      margin-bottom: 24px;
      animation: splash-fade-in 1s ease 0.2s both;
    }

    .splash-title {
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e0e8ff, var(--cyan), var(--star-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(92, 200, 224, 0.25));
      margin-bottom: 12px;
      animation: splash-fade-in 1s ease 0.4s both;
    }

    .splash-uni {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      animation: splash-fade-in 1s ease 0.6s both;
    }

    .splash-sub {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 36px;
      animation: splash-fade-in 1s ease 0.7s both;
    }

    /* Facts carousel */
    .splash-fact-wrap {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      animation: splash-fade-in 1s ease 0.9s both;
    }

    .splash-fact {
      padding: 14px 22px;
      background: rgba(92, 200, 224, 0.06);
      border: 1px solid rgba(92, 200, 224, 0.12);
      border-radius: 16px;
      font-size: 0.88rem;
      color: rgba(200, 220, 240, 0.82);
      line-height: 1.55;
      max-width: 560px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .splash-fact.fading {
      opacity: 0;
      transform: translateY(8px);
    }

    .splash-fact-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
      opacity: 0.7;
    }

    /* Launch button */
    .splash-launch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 44px;
      background: linear-gradient(135deg, var(--cyan), var(--star-blue));
      color: #0a1428;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 6px 30px rgba(92, 200, 224, 0.25);
      animation: splash-fade-in 1s ease 1.1s both;
    }

    .splash-launch:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 40px rgba(92, 200, 224, 0.35);
    }

    .splash-launch:active {
      transform: translateY(-1px) scale(1.01);
    }

    @keyframes splash-fade-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════
       GAME AREA
       ══════════════════════════════════════ */
    #game-area {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease 0.3s, visibility 0.9s ease 0.3s;
    }

    #game-area.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Game background — subtle */
    .game-bg-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.35;
    }

    .game-bg-stars .g-star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: g-twinkle var(--dur) ease-in-out infinite alternate;
    }

    @keyframes g-twinkle {
      0% { opacity: var(--mop); }
      100% { opacity: 0.6; }
    }

    .game-nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      filter: blur(80px);
      background:
        radial-gradient(ellipse 600px 400px at 15% 20%, rgba(80, 50, 140, 0.30), transparent),
        radial-gradient(ellipse 500px 350px at 80% 25%, rgba(30, 70, 160, 0.22), transparent),
        radial-gradient(ellipse 400px 300px at 50% 80%, rgba(160, 100, 40, 0.15), transparent);
    }

    .game-planet {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .gp-earth {
      width: 180px; height: 180px;
      bottom: -50px; left: -60px;
      background: radial-gradient(circle at 38% 35%, #4a8ab0, #1e4a6a 55%, #12304a 80%);
      box-shadow: 0 0 40px rgba(40, 110, 160, 0.12);
      opacity: 0.15;
      animation: gp-float 22s ease-in-out infinite;
    }

    .gp-small {
      width: 50px; height: 50px;
      top: 12%; right: 5%;
      background: radial-gradient(circle at 35% 35%, #b08060, #6a4030 60%);
      box-shadow: 0 0 18px rgba(140, 90, 50, 0.08);
      opacity: 0.16;
      animation: gp-float 28s ease-in-out infinite reverse;
    }

    .gp-saturn {
      width: 70px; height: 70px;
      top: 50%; left: 3%;
      background: radial-gradient(circle at 38% 35%, #d0b060, #9a7020 55%);
      box-shadow: 0 0 22px rgba(180, 140, 40, 0.08);
      opacity: 0.13;
      animation: gp-float 30s ease-in-out infinite;
    }

    .gp-saturn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 110px; height: 24px;
      border: 1.5px solid rgba(208, 176, 96, 0.16);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
    }

    @keyframes gp-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .game-rocket {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 1.3rem;
      opacity: 0;
    }

    .gr--1 { animation: gr-fly-1 32s linear infinite; }
    .gr--2 { animation: gr-fly-2 40s linear infinite 12s; }

    @keyframes gr-fly-1 {
      0% { bottom: -30px; left: 6%; opacity: 0; transform: rotate(-48deg) scale(0.85); }
      3% { opacity: 0.28; }
      88% { opacity: 0.28; }
      95% { opacity: 0; }
      100% { bottom: 108%; left: 60%; opacity: 0; transform: rotate(-48deg) scale(0.95); }
    }

    @keyframes gr-fly-2 {
      0% { bottom: -30px; right: 10%; left: auto; opacity: 0; transform: rotate(-38deg) scale(0.8); }
      3% { opacity: 0.25; }
      82% { opacity: 0.25; }
      92% { opacity: 0; }
      100% { bottom: 110%; right: 55%; left: auto; opacity: 0; transform: rotate(-38deg) scale(0.9); }
    }

    .game-shoot {
      position: fixed;
      width: 2px; height: 2px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
    }

    .game-shoot::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 50px; height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.4), transparent);
      transform-origin: right center;
      transform: translateX(100%);
    }

    .gs--1 { top: 18%; left: 62%; animation: gs-anim 5s ease-in-out infinite 3s; }
    .gs--2 { top: 45%; left: 78%; animation: gs-anim 6s ease-in-out infinite 9s; }

    @keyframes gs-anim {
      0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
      5% { opacity: 0.7; }
      13% { opacity: 0.7; transform: translate(-160px, 90px) rotate(-35deg); }
      18% { opacity: 0; transform: translate(-210px, 120px) rotate(-35deg); }
      100% { opacity: 0; }
    }

    /* ══════════════════════════════════════
       GAME UI (full opacity)
       ══════════════════════════════════════ */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      margin: 0 auto;
      padding: 24px 18px 56px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(200, 112, 64, 0.10);
      border: 1px solid rgba(200, 112, 64, 0.20);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rocket-orange);
      margin-bottom: 16px;
    }

    .hero__title {
      font-size: clamp(2rem, 6.5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #d0d8f0, var(--star-blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(92, 200, 224, 0.15));
    }

    .hero__uni {
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero__divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: rgba(92, 200, 224, 0.18);
      font-size: 0.5rem;
      letter-spacing: 0.6em;
      user-select: none;
    }

    .hero__divider::before,
    .hero__divider::after {
      content: '';
      flex: 1;
      max-width: 90px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(92, 200, 224, 0.12), transparent);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .teams-panel, .board-panel, .final-panel {
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .section-title__icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--star-blue), var(--nebula));
      color: #fff;
      font-size: 1rem;
    }

    .team-topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .team-add {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-add input {
      width: 240px;
      max-width: 100%;
      border: 1px solid rgba(92, 200, 224, 0.14);
      background: rgba(255,255,255,0.05);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-family: inherit;
      transition: 0.25s;
    }

    .team-add input:focus {
      border-color: rgba(92, 200, 224, 0.35);
      box-shadow: 0 0 0 3px rgba(92, 200, 224, 0.08);
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      transition: 0.22s ease;
    }

    .btn:hover { opacity: 0.90; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.40; cursor: not-allowed; transform: none; }

    .btn--main {
      background: linear-gradient(135deg, var(--star-blue), #3a7aaa);
      color: #fff;
      padding: 12px 18px;
    }

    .btn--soft {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .btn--gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1a1a1a;
      padding: 12px 18px;
    }

    .btn--green {
      background: linear-gradient(135deg, #30c878, #1a9a55);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--red {
      background: linear-gradient(135deg, #d86070, #b83a4a);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--purple {
      background: linear-gradient(135deg, var(--nebula), var(--pink));
      color: #fff;
      padding: 13px 18px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
    }

    .team-card {
      background: linear-gradient(145deg, rgba(92, 200, 224, 0.04), rgba(106, 80, 184, 0.03));
      border: 1px solid rgba(92, 200, 224, 0.08);
      border-radius: 18px;
      padding: 18px;
      transition: 0.3s;
    }

    .team-card.active {
      border-color: rgba(92, 200, 224, 0.35);
      box-shadow: 0 0 0 1px rgba(92, 200, 224, 0.10), 0 14px 30px rgba(0,0,0,0.22);
    }

    .team-card__name {
      color: var(--cyan);
      font-size: 1.02rem;
      font-weight: 800;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .team-card__score {
      font-size: 2.2rem;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 16px;
    }

    .team-card__actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .team-card__actions .btn { flex: 1; min-height: 42px; }

    .team-card__bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .team-select-btn { flex: 1; }

    .team-remove-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      transition: 0.2s;
    }

    .team-remove-btn:hover { color: var(--red); }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 12px;
    }

    .round-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(92, 200, 224, 0.04);
      border: 1px solid rgba(92, 200, 224, 0.09);
    }

      answerShown: false
    };

    const teamsSection = document.getElementById("teams-section");
    const boardSection = document.getElementById("board-section");
    const questionOverlay = document.getElementById("question-overlay");
    const finalSection = document.getElementById("final-section");

    function esc(v) {
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    function qk(r,t,q) { return `${r}-${t}-${q}`; }
    function used(r,t,q) { return state.usedQuestions.has(qk(r,t,q)); }

    function roundDone(ri) {
      const rd = GAME_CONFIG.rounds[ri];
      for (let t=0;t<rd.themes.length;t++)
        for (let q=0;q<rd.themes[t].questions.length;q++)
          if (!used(ri,t,q)) return false;
      return true;
    }

    function curRound() { return GAME_CONFIG.rounds[state.currentRoundIndex]; }

    function remaining(ri) {
      let n=0;
      GAME_CONFIG.rounds[ri].themes.forEach((th,ti) =>
        th.questions.forEach((_,qi) => { if (!used(ri,ti,qi)) n++; }));
      return n;
    }

    function sorted() { return [...state.teams].sort((a,b)=>b.score-a.score); }

    function addTeam() {
      const inp = document.getElementById("team-name-input");
      if (!inp) return;
      const nm = inp.value.trim();
      if (!nm) return;
      state.teams.push({id:Date.now()+Math.random(), name:nm, score:0});
      if (!state.selectedTeamId) state.selectedTeamId = state.teams[0].id;
      inp.value = "";
      render();
    }

    function removeTeam(id) {
      const t = state.teams.find(x=>x.id===id);
      if (!t||!confirm(`Удалить экипаж «${t.name}»?`)) return;
      state.teams = state.teams.filter(x=>x.id!==id);
      if (state.selectedTeamId===id)
        state.selectedTeamId = state.teams.length ? state.teams[0].id : null;
      render();
    }

    function changeScore(id, amt) {
      const t = state.teams.find(x=>x.id===id);
      if (t) { t.score += amt; renderTeams(); }
    }

    function selectTeam(id) {
      state.selectedTeamId = id;
      renderTeams(); renderBoard();
    }

    function openQ(ri,ti,qi) {
      if (state.gameFinished) return;
      if (!state.selectedTeamId) { alert("Сначала выберите экипаж."); return; }
      if (used(ri,ti,qi)) return;
      const rd=GAME_CONFIG.rounds[ri], th=rd.themes[ti], q=th.questions[qi];
      const tm=state.teams.find(x=>x.id===state.selectedTeamId);
      state.activeQuestion = {ri,ti,qi,question:q,themeName:th.name,teamId:tm?tm.id:null};
      state.answerShown = false;
      questionOverlay.classList.remove("hidden");
      renderModal();
    }

    function closeQ() {
      state.activeQuestion=null; state.answerShown=false;
      questionOverlay.classList.add("hidden");
      questionOverlay.innerHTML="";
    }

    function showAns() { state.answerShown=true; renderModal(); }

    function renderModal() {
      if (!state.activeQuestion) return;
      const tm=state.teams.find(x=>x.id===state.activeQuestion.teamId);
      const {question:q,themeName}=state.activeQuestion;
      questionOverlay.innerHTML=`
        <div class="question-modal">
          <div class="question-modal__top">
            <div class="question-modal__theme">${esc(themeName)}</div>
            <div class="question-modal__price">${q.price}</div>
            <div class="question-modal__team">
              <span>Отвечает:</span>
              <strong>${tm?esc(tm.name):"—"}</strong>
            </div>
          </div>
          <div class="question-modal__text">${esc(q.question)}</div>
          <div class="answer-box ${state.answerShown?"visible":""}">${esc(q.answer)}</div>
          <div class="question-actions">
            ${state.answerShown
              ?`<button class="btn btn--green" onclick="correct()">Верно</button>
                <button class="btn btn--red" onclick="wrong()">Неверно</button>`
              :`<button class="btn btn--purple" onclick="showAns()">Показать ответ</button>
                <button class="btn btn--soft" onclick="closeQ()">Назад</button>`}
          </div>
        </div>`;
    }

    function markUsed() {
      const {ri,ti,qi}=state.activeQuestion;
      state.usedQuestions.add(qk(ri,ti,qi));
    }

    function correct() {
      if (!state.activeQuestion) return;
      const t=state.teams.find(x=>x.id===state.activeQuestion.teamId);
      if (t) t.score += state.activeQuestion.question.price;
      markUsed(); proceed();
    }

    function wrong() {
      if (!state.activeQuestion) return;
      const t=state.teams.find(x=>x.id===state.activeQuestion.teamId);
      if (t) t.score -= state.activeQuestion.question.price;
      markUsed(); proceed();
    }

    function proceed() {
      const ri=state.activeQuestion.ri;
      closeQ();
      if (roundDone(ri)) {
        if (ri<GAME_CONFIG.rounds.length-1) {
          state.currentRoundIndex=ri+1; state.roundOpen=true;
        } else { finish(); return; }
      }
      render();
    }

    function finish() {
      state.gameFinished=true; state.roundOpen=false;
      teamsSection.classList.add("hidden");
      boardSection.classList.add("hidden");
      renderFinal();
      finalSection.classList.remove("hidden");
    }

    function renderTeams() {
      if (state.gameFinished) return;
      teamsSection.innerHTML=`
        <div class="team-topbar">
          <div><h2 class="section-title">
            <span class="section-title__icon">★</span> Экипажи
          </h2></div>
          <div class="team-add">
            <input id="team-name-input" type="text" placeholder="Название экипажа"
              onkeydown="if(event.key==='Enter')addTeam()"/>
            <button class="btn btn--main" onclick="addTeam()">Добавить</button>
          </div>
        </div>
        ${state.teams.length===0
          ?`<div class="empty-state">Добавьте экипажи и выберите отвечающий.</div>`
          :`<div class="teams-grid">${state.teams.map(t=>`
            <div class="team-card ${state.selectedTeamId===t.id?"active":""}">
              <div class="team-card__name">${esc(t.name)}</div>
              <div class="team-card__score">${t.score}</div>
              <div class="team-card__actions">
                <button class="btn btn--red" onclick="changeScore(${t.id},-100)">−100</button>
                <button class="btn btn--green" onclick="changeScore(${t.id},100)">+100</button>
              </div>
              <div class="team-card__bottom">
                <button class="btn btn--gold team-select-btn" onclick="selectTeam(${t.id})">
                  ${state.selectedTeamId===t.id?"Отвечает":"Выбрать"}
                </button>
                <button class="team-remove-btn" onclick="removeTeam(${t.id})">удалить</button>
              </div>
            </div>`).join("")}</div>`}`;
    }

    function renderBoard() {
      if (state.gameFinished) return;
      const rd=curRound(), rem=remaining(state.currentRoundIndex);
      const sel=state.teams.find(x=>x.id===state.selectedTeamId);
      boardSection.innerHTML=`
        <div class="round-status">
          <div class="round-status__left">
            <div class="round-status__label">Активный этап</div>
            <div class="round-status__title">${esc(rd.name)}</div>
          </div>
          <div class="round-status__right">
            <span>Осталось: ${rem}</span>
            <button class="btn btn--soft" onclick="toggleRound()">${state.roundOpen?"Скрыть":"Раскрыть"}</button>
          </div>
        </div>
        ${state.roundOpen?`
          <div class="round-accordion"><div class="round-accordion__body"><div class="game-board">
            ${rd.themes.map((th,ti)=>`
              <div class="theme-row">
                <div class="theme-title">${esc(th.name)}</div>
                <div class="theme-cells">
                  ${th.questions.map((q,qi)=>{
                    const u=used(state.currentRoundIndex,ti,qi);
                    return`<div class="question-cell ${u?"question-cell--used":""}">
                      <div class="question-cell__price">${q.price}</div>
                      <button class="btn btn--gold question-cell__play" ${u?"disabled":""}
                        onclick="openQ(${state.currentRoundIndex},${ti},${qi})">Играть</button>
                    </div>`;}).join("")}
                </div>
              </div>`).join("")}
          </div></div></div>`:""}
        <div class="board-hint">${sel
          ?`Отвечает: <strong>${esc(sel.name)}</strong>`
          :`Выберите <strong>отвечающий экипаж</strong> выше`}</div>`;
    }

    function toggleRound() { state.roundOpen=!state.roundOpen; renderBoard(); }

    function renderFinal() {
      const s=sorted();
      finalSection.innerHTML=`
        <div class="final-title">Миссия завершена</div>
        <div class="final-subtitle">Итоговая таблица результатов</div>
        ${s.length===0?`<div class="empty-state">Экипажи не добавлены.</div>`:`
          <div class="leaderboard">${s.map((t,i)=>`
            <div class="leaderboard-item ${i===0?"leaderboard-item--1":""}">
              <div class="leaderboard-place">${i+1}</div>
              <div class="leaderboard-name">${esc(t.name)}</div>
              <div class="leaderboard-score">${t.score}</div>
            </div>`).join("")}</div>`}`;
    }

    function render() { renderTeams(); renderBoard(); }

    document.addEventListener("keydown", e => {
      if (e.key==="Escape"&&!questionOverlay.classList.contains("hidden")) closeQ();
    });

    render();
  </script>
</body>
</html>
