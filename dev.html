<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Своя Игра — День Космонавтики 🚀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #020810;
      --bg-2: #0a1628;
      --bg-3: #06102a;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.10);
      --text: #e8edf5;
      --muted: rgba(200, 215, 255, 0.60);
      --gold: #ffd54a;
      --gold-2: #ffb800;
      --cyan: #64e8ff;
      --purple: #a97cff;
      --pink: #ff5fc7;
      --green: #27d67a;
      --red: #ff5d73;
      --star-blue: #4fc3f7;
      --nebula: #7c4dff;
      --rocket-orange: #ff7043;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.50);
      --radius: 22px;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--bg-1);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== STAR FIELD ========== */
    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: var(--min-op); transform: scale(1); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* ========== SHOOTING STARS ========== */
    .shooting-star {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: shoot 3s ease-in-out infinite;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 1.5px;
      background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
      transform-origin: right center;
      transform: translateX(100%);
    }

    .shooting-star:nth-child(1) {
      top: 12%;
      left: 70%;
      animation-delay: 1s;
    }

    .shooting-star:nth-child(2) {
      top: 35%;
      left: 85%;
      animation-delay: 5s;
      animation-duration: 4s;
    }

    .shooting-star:nth-child(3) {
      top: 60%;
      left: 55%;
      animation-delay: 9s;
      animation-duration: 3.5s;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
      5% { opacity: 1; }
      15% { opacity: 1; transform: translate(-200px, 120px) rotate(-35deg); }
      20% { opacity: 0; transform: translate(-280px, 160px) rotate(-35deg); }
      100% { opacity: 0; }
    }

    /* ========== NEBULA BG ========== */
    .page-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 900px 600px at 10% 15%, rgba(100, 60, 200, 0.12), transparent),
        radial-gradient(ellipse 700px 500px at 85% 20%, rgba(30, 100, 220, 0.10), transparent),
        radial-gradient(ellipse 600px 400px at 50% 85%, rgba(255, 112, 67, 0.06), transparent),
        radial-gradient(ellipse 500px 500px at 70% 60%, rgba(76, 175, 255, 0.06), transparent);
    }

    /* ========== FLOATING PLANET ========== */
    .planet {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .planet--earth {
      width: 180px;
      height: 180px;
      bottom: -40px;
      left: -50px;
      background: radial-gradient(circle at 35% 35%, #4fc3f7, #1565c0 50%, #0d47a1 80%);
      box-shadow: 0 0 60px rgba(79, 195, 247, 0.25), inset -30px -20px 40px rgba(0,0,0,0.35);
      animation: float-planet 18s ease-in-out infinite;
    }

    .planet--mars {
      width: 100px;
      height: 100px;
      top: 80px;
      right: 40px;
      background: radial-gradient(circle at 35% 35%, #ff8a65, #d84315 60%, #bf360c 85%);
      box-shadow: 0 0 40px rgba(255, 112, 67, 0.15), inset -15px -10px 25px rgba(0,0,0,0.3);
      animation: float-planet 22s ease-in-out infinite reverse;
    }

    .planet--saturn {
      width: 70px;
      height: 70px;
      top: 40%;
      left: 60px;
      background: radial-gradient(circle at 35% 35%, #ffe082, #f9a825 60%, #f57f17 85%);
      box-shadow: 0 0 30px rgba(255, 213, 74, 0.12), inset -12px -8px 18px rgba(0,0,0,0.25);
      animation: float-planet 25s ease-in-out infinite;
    }

    /* Saturn ring */
    .planet--saturn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 30px;
      border: 2px solid rgba(255, 224, 130, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
    }

    @keyframes float-planet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    /* ========== FLOATING ROCKET EMOJI ========== */
    .rocket-float {
      position: fixed;
      font-size: 2.8rem;
      z-index: 0;
      pointer-events: none;
      animation: rocket-fly 30s linear infinite;
      filter: drop-shadow(0 0 12px rgba(255, 112, 67, 0.5));
    }

    @keyframes rocket-fly {
      0% {
        bottom: -60px;
        left: 10%;
        opacity: 0;
        transform: rotate(-45deg) scale(0.8);
      }
      5% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        bottom: 110%;
        left: 80%;
        opacity: 0;
        transform: rotate(-45deg) scale(1.1);
      }
    }

    /* ========== APP ========== */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      margin: 0 auto;
      padding: 24px 18px 56px;
    }

    /* ========== HERO ========== */
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(255, 112, 67, 0.12);
      border: 1px solid rgba(255, 112, 67, 0.25);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--rocket-orange);
      margin-bottom: 14px;
      animation: pulse-badge 3s ease-in-out infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 112, 67, 0.15); }
      50% { box-shadow: 0 0 0 10px rgba(255, 112, 67, 0); }
    }

    .hero__title {
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e8eaff, var(--star-blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(100, 232, 255, 0.30));
    }

    .hero__uni {
      margin-top: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero__date {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    /* ========== PANELS ========== */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .teams-panel,
    .board-panel,
    .final-panel {
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .section-title__icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--star-blue), var(--nebula));
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 0 18px rgba(124, 77, 255, 0.20);
    }

    .team-topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .team-add {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-add input {
      width: 240px;
      max-width: 100%;
      border: 1px solid rgba(100, 232, 255, 0.16);
      background: rgba(255,255,255,0.05);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-family: inherit;
      transition: 0.25s;
    }

    .team-add input:focus {
      border-color: var(--star-blue);
      box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.12);
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      transition: 0.22s ease;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn--main {
      background: linear-gradient(135deg, var(--star-blue), #1e88e5);
      color: #fff;
      padding: 12px 18px;
      box-shadow: 0 4px 18px rgba(79, 195, 247, 0.18);
    }

    .btn--soft {
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn--gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #151515;
      padding: 12px 18px;
      box-shadow: 0 4px 18px rgba(255, 184, 0, 0.15);
    }

    .btn--green {
      background: linear-gradient(135deg, #35e48d, #17b866);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--red {
      background: linear-gradient(135deg, #ff7085, #eb435c);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--purple {
      background: linear-gradient(135deg, var(--nebula), var(--pink));
      color: #fff;
      padding: 13px 18px;
      box-shadow: 0 4px 18px rgba(124, 77, 255, 0.15);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
    }

    .team-card {
      background: linear-gradient(145deg, rgba(100, 232, 255, 0.04), rgba(124, 77, 255, 0.03));
      border: 1px solid rgba(100, 232, 255, 0.10);
      border-radius: 18px;
      padding: 18px;
      transition: 0.3s;
    }

    .team-card:hover {
      border-color: rgba(100, 232, 255, 0.20);
    }

    .team-card.active {
      border-color: rgba(100, 232, 255, 0.50);
      box-shadow: 0 0 0 2px rgba(100, 232, 255, 0.12), 0 16px 35px rgba(0,0,0,0.28),
                  0 0 40px rgba(100, 232, 255, 0.06);
    }

    .team-card__name {
      color: var(--cyan);
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .team-card__score {
      font-size: 2.3rem;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 16px;
      text-shadow: 0 0 18px rgba(255, 213, 74, 0.20);
    }

    .team-card__actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .team-card__actions .btn {
      flex: 1;
      min-height: 42px;
    }

    .team-card__bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .team-select-btn {
      flex: 1;
    }

    .team-remove-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.30);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      transition: 0.2s;
    }

    .team-remove-btn:hover {
      color: var(--red);
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 12px;
    }

    /* ========== ROUND STATUS ========== */
    .round-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.05), rgba(124, 77, 255, 0.04));
      border: 1px solid rgba(79, 195, 247, 0.12);
    }

    .round-status__left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .round-status__label {
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .round-status__title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--star-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .round-status__right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .round-accordion {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(79, 195, 247, 0.08);
      background: rgba(255,255,255,0.02);
    }

    .round-accordion__body {
      padding: 16px;
    }

    .game-board {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .theme-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .theme-title {
      width: 180px;
      min-width: 180px;
      min-height: 112px;
      background: linear-gradient(135deg, rgba(124, 77, 255, 0.12), rgba(79, 195, 247, 0.10));
      border: 1px solid rgba(124, 77, 255, 0.22);
      border-radius: 16px;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--purple);
      text-align: center;
      line-height: 1.35;
    }

    .theme-cells {
      display: flex;
      flex: 1;
      gap: 12px;
    }

    .question-cell {
      flex: 1;
      min-height: 112px;
      background: linear-gradient(145deg, rgba(255,213,74,0.08), rgba(255,184,0,0.03));
      border: 1px solid rgba(255,213,74,0.18);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
      transition: 0.25s;
      position: relative;
      overflow: hidden;
    }

    .question-cell:hover:not(.question-cell--used) {
      border-color: rgba(255,213,74,0.35);
      box-shadow: 0 0 20px rgba(255, 213, 74, 0.08);
    }

    /* Subtle star sparkle on cells */
    .question-cell::before {
      content: '✦';
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.6rem;
      color: rgba(255, 213, 74, 0.25);
      animation: cell-sparkle 4s ease-in-out infinite;
    }

    @keyframes cell-sparkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.4); }
    }

    .question-cell--used {
      opacity: 0.28;
      pointer-events: none;
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.04);
    }

    .question-cell--used::before {
      display: none;
    }

    .question-cell__price {
      font-size: 1.75rem;
      color: var(--gold);
      font-weight: 900;
      text-shadow: 0 0 14px rgba(255, 213, 74, 0.15);
    }

    .question-cell__play {
      min-width: 92px;
      padding: 8px 12px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .board-hint {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    .board-hint strong {
      color: var(--cyan);
    }

    /* ========== QUESTION MODAL ========== */
    .question-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(2, 8, 16, 0.82);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .question-modal {
      width: 100%;
      max-width: 860px;
      background: linear-gradient(145deg, rgba(10, 22, 50, 0.97), rgba(5, 10, 30, 0.98));
      border: 1px solid rgba(100, 232, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.55), 0 0 60px rgba(100, 232, 255, 0.04);
      padding: 34px 30px 28px;
      position: relative;
      overflow: hidden;
    }

    /* Stars inside modal */
    .question-modal::before {
      content: '✦  ✧  ★  ✦  ✧';
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 1.2em;
      color: rgba(100, 232, 255, 0.15);
      pointer-events: none;
    }

    .question-modal__top {
      text-align: center;
      margin-bottom: 24px;
    }

    .question-modal__theme {
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .question-modal__price {
      color: var(--gold);
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 16px;
      text-shadow: 0 0 24px rgba(255, 213, 74, 0.20);
    }

    .question-modal__team {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      background: rgba(100, 232, 255, 0.06);
      border-radius: 999px;
      border: 1px solid rgba(100, 232, 255, 0.12);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .question-modal__team strong {
      color: var(--cyan);
    }

    .question-modal__text {
      text-align: center;
      font-size: 1.45rem;
      line-height: 1.65;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .answer-box {
      display: none;
      margin-bottom: 24px;
      text-align: center;
      background: rgba(39,214,122,0.08);
      border: 1px solid rgba(39,214,122,0.22);
      color: #baf6d3;
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .answer-box.visible {
      display: block;
    }

    .question-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .question-actions .btn {
      min-height: 52px;
      font-size: 0.98rem;
    }

    /* ========== FINAL ========== */
    .final-panel {
      text-align: center;
    }

    .final-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .final-subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .leaderboard {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.06);
    }

    .leaderboard-item--1 {
      border-color: rgba(255,213,74,0.42);
      box-shadow: 0 0 0 1px rgba(255,213,74,0.18), 0 0 30px rgba(255, 213, 74, 0.08);
      background: linear-gradient(145deg, rgba(255, 213, 74, 0.06), rgba(255, 184, 0, 0.03));
    }

    .leaderboard-place {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
    }

    .leaderboard-name {
      text-align: left;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--cyan);
      word-break: break-word;
    }

    .leaderboard-score {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    /* ========== CONSTELLATION DIVIDER ========== */
    .constellation-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0;
      color: rgba(100, 232, 255, 0.25);
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      user-select: none;
    }

    .constellation-divider::before,
    .constellation-divider::after {
      content: '';
      flex: 1;
      max-width: 120px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(100, 232, 255, 0.12), transparent);
    }

  <script>
    const state = {
      teams: [],
      selectedTeamId: null,
      currentRoundIndex: 0,
      roundOpen: true,
      activeQuestion: null,
      usedQuestions: new Set(),
      gameFinished: false,
      answerShown: false
    };

    const teamsSection = document.getElementById("teams-section");
    const boardSection = document.getElementById("board-section");
    const questionOverlay = document.getElementById("question-overlay");
    const finalSection = document.getElementById("final-section");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getQuestionKey(roundIndex, themeIndex, questionIndex) {
      return `${roundIndex}-${themeIndex}-${questionIndex}`;
    }

    function isQuestionUsed(roundIndex, themeIndex, questionIndex) {
      return state.usedQuestions.has(getQuestionKey(roundIndex, themeIndex, questionIndex));
    }

    function isRoundCompleted(roundIndex) {
      const round = GAME_CONFIG.rounds[roundIndex];
      for (let themeIndex = 0; themeIndex < round.themes.length; themeIndex += 1) {
        for (let questionIndex = 0; questionIndex < round.themes[themeIndex].questions.length; questionIndex += 1) {
          if (!isQuestionUsed(roundIndex, themeIndex, questionIndex)) {
            return false;
          }
        }
      }
      return true;
    }

    function getCurrentRound() {
      return GAME_CONFIG.rounds[state.currentRoundIndex];
    }

    function getRemainingQuestionsInRound(roundIndex) {
      const round = GAME_CONFIG.rounds[roundIndex];
      let total = 0;
      round.themes.forEach((theme, themeIndex) => {
        theme.questions.forEach((_, questionIndex) => {
          if (!isQuestionUsed(roundIndex, themeIndex, questionIndex)) {
            total += 1;
          }
        });
      });
      return total;
    }

    function sortTeamsByScore() {
      return [...state.teams].sort((a, b) => b.score - a.score);
    }

    function addTeam() {
      const input = document.getElementById("team-name-input");
      if (!input) return;

      const name = input.value.trim();
      if (!name) return;

      state.teams.push({
        id: Date.now() + Math.random(),
        name,
        score: 0
      });

      if (state.selectedTeamId === null) {
        state.selectedTeamId = state.teams[0].id;
      }

      input.value = "";
      render();
    }

    function removeTeam(teamId) {
      const team = state.teams.find((item) => item.id === teamId);
      if (!team) return;

      const confirmed = window.confirm(`Удалить команду «${team.name}»?`);
      if (!confirmed) return;

      state.teams = state.teams.filter((item) => item.id !== teamId);

      if (state.selectedTeamId === teamId) {
        state.selectedTeamId = state.teams.length ? state.teams[0].id : null;
      }

      render();
    }

    function changeTeamScore(teamId, amount) {
      const team = state.teams.find((item) => item.id === teamId);
      if (!team) return;
      team.score += amount;
      renderTeams();
    }

    function selectTeam(teamId) {
      state.selectedTeamId = teamId;
      renderTeams();
      renderBoard();
    }

    function openQuestion(roundIndex, themeIndex, questionIndex) {
      if (state.gameFinished) return;
      if (state.selectedTeamId === null) {
        alert("Сначала выберите команду, которая отвечает.");
        return;
      }

      const key = getQuestionKey(roundIndex, themeIndex, questionIndex);
      if (state.usedQuestions.has(key)) return;

      const round = GAME_CONFIG.rounds[roundIndex];
      const theme = round.themes[themeIndex];
      const question = theme.questions[questionIndex];
      const team = state.teams.find((item) => item.id === state.selectedTeamId);

      state.activeQuestion = {
        roundIndex,
        themeIndex,
        questionIndex,
        question,
        themeName: theme.name,
        teamId: team ? team.id : null
      };

      state.answerShown = false;
      questionOverlay.classList.remove("hidden");
      renderQuestionModal();
    }

    function closeQuestion() {
      state.activeQuestion = null;
      state.answerShown = false;
      questionOverlay.classList.add("hidden");
      questionOverlay.innerHTML = "";
    }

    function showAnswer() {
      state.answerShown = true;
      renderQuestionModal();
    }

    function renderQuestionModal() {
      if (!state.activeQuestion) return;

      const activeTeam = state.teams.find((item) => item.id === state.activeQuestion.teamId);
      const { question, themeName } = state.activeQuestion;

      questionOverlay.innerHTML = `
        <div class="question-modal">
          <div class="question-modal__top">
            <div class="question-modal__theme">🌌 ${escapeHtml(themeName)}</div>
            <div class="question-modal__price">${question.price}</div>
            <div class="question-modal__team">
              <span>🧑‍🚀 Отвечает:</span>
              <strong>${activeTeam ? escapeHtml(activeTeam.name) : "Команда не выбрана"}</strong>
            </div>
          </div>

          <div class="question-modal__text">${escapeHtml(question.question)}</div>

          <div class="answer-box ${state.answerShown ? "visible" : ""}">
            ✅ ${escapeHtml(question.answer)}
          </div>

          <div class="question-actions">
            ${
              state.answerShown
                ? `
                  <button class="btn btn--green" onclick="handleCorrectAnswer()">✓ Верно</button>
                  <button class="btn btn--red" onclick="handleWrongAnswer()">✗ Неверно</button>
                `
                : `
                  <button class="btn btn--purple" onclick="showAnswer()">🔭 Показать ответ</button>
                  <button class="btn btn--soft" onclick="closeQuestion()">← Вернуться назад</button>
                `
            }
          </div>
        </div>
      `;
    }

    function markQuestionAsUsed() {
      const { roundIndex, themeIndex, questionIndex } = state.activeQuestion;
      state.usedQuestions.add(getQuestionKey(roundIndex, themeIndex, questionIndex));
    }

    function handleCorrectAnswer() {
      if (!state.activeQuestion) return;

      const team = state.teams.find((item) => item.id === state.activeQuestion.teamId);
      if (team) {
        team.score += state.activeQuestion.question.price;
      }

      markQuestionAsUsed();
      proceedAfterAnswer();
    }

    function handleWrongAnswer() {
      if (!state.activeQuestion) return;

      const team = state.teams.find((item) => item.id === state.activeQuestion.teamId);
      if (team) {
        team.score -= state.activeQuestion.question.price;
      }

      markQuestionAsUsed();
      proceedAfterAnswer();
    }

    function proceedAfterAnswer() {
      const answeredRoundIndex = state.activeQuestion.roundIndex;
      closeQuestion();

      if (isRoundCompleted(answeredRoundIndex)) {
        if (answeredRoundIndex < GAME_CONFIG.rounds.length - 1) {
          state.currentRoundIndex = answeredRoundIndex + 1;
          state.roundOpen = true;
        } else {
          finishGame();
          return;
        }
      }

      render();
    }

    function finishGame() {
      state.gameFinished = true;
      state.roundOpen = false;
      teamsSection.classList.add("hidden");
      boardSection.classList.add("hidden");
      renderFinalLeaderboard();
      finalSection.classList.remove("hidden");
    }

    function renderTeams() {
      if (state.gameFinished) return;

      teamsSection.innerHTML = `
        <div class="team-topbar">
          <div>
            <h2 class="section-title">
              <span class="section-title__icon">🧑‍🚀</span>
              Экипажи
            </h2>
          </div>

          <div class="team-add">
            <input
              id="team-name-input"
              type="text"
              placeholder="Название экипажа"
              onkeydown="if(event.key === 'Enter') addTeam()"
            />
            <button class="btn btn--main" onclick="addTeam()">🚀 Добавить экипаж</button>
          </div>
        </div>

        ${
          state.teams.length === 0
            ? `<div class="empty-state">Добавьте экипажи и выберите, кто отвечает. ✦</div>`
            : `
              <div class="teams-grid">
                ${state.teams.map((team) => `
                  <div class="team-card ${state.selectedTeamId === team.id ? "active" : ""}">
                    <div class="team-card__name">🛸 ${escapeHtml(team.name)}</div>
                    <div class="team-card__score">${team.score}</div>

                    <div class="team-card__actions">
                      <button class="btn btn--red" onclick="changeTeamScore(${team.id}, -100)">−100</button>
                      <button class="btn btn--green" onclick="changeTeamScore(${team.id}, 100)">+100</button>
                    </div>

                    <div class="team-card__bottom">
                      <button class="btn btn--gold team-select-btn" onclick="selectTeam(${team.id})">
                        ${state.selectedTeamId === team.id ? "⭐ Отвечает сейчас" : "Выбрать"}
                      </button>
                      <button class="team-remove-btn" onclick="removeTeam(${team.id})">удалить</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            `
        }
      `;
    }

    function renderBoard() {
      if (state.gameFinished) return;

      const round = getCurrentRound();
      const remaining = getRemainingQuestionsInRound(state.currentRoundIndex);
      const selectedTeam = state.teams.find((item) => item.id === state.selectedTeamId);

      boardSection.innerHTML = `
        <div class="round-status">
          <div class="round-status__left">
            <div class="round-status__label">🌠 Активный этап</div>
            <div class="round-status__title">${escapeHtml(round.name)}</div>
          </div>
          <div class="round-status__right">
            <div class="round-status__questions">Осталось вопросов: ${remaining}</div>
            <button class="btn btn--soft" onclick="toggleCurrentRound()">
              ${state.roundOpen ? "Скрыть" : "Раскрыть"}
            </button>
          </div>
        </div>

        ${
          state.roundOpen
            ? `
              <div class="round-accordion">
                <div class="round-accordion__body">
                  <div class="game-board">
                    ${round.themes.map((theme, themeIndex) => `
                      <div class="theme-row">
                        <div class="theme-title">🪐 ${escapeHtml(theme.name)}</div>
                        <div class="theme-cells">
                          ${theme.questions.map((question, questionIndex) => {
                            const used = isQuestionUsed(state.currentRoundIndex, themeIndex, questionIndex);
                            return `
                              <div class="question-cell ${used ? "question-cell--used" : ""}">
                                <div class="question-cell__price">${question.price}</div>
                                <button
                                  class="btn btn--gold question-cell__play"
                                  ${used ? "disabled" : ""}
                                  onclick="openQuestion(${state.currentRoundIndex}, ${themeIndex}, ${questionIndex})"
                                >
                                  Играть
                                </button>
                              </div>
                            `;
                          }).join("")}
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            `
            : ""
        }

        <div class="board-hint">
          ${
            selectedTeam
              ? `🧑‍🚀 Сейчас отвечает: <strong>${escapeHtml(selectedTeam.name)}</strong>`
              : `Сначала выберите <strong>отвечающий экипаж</strong> сверху`
          }
        </div>
      `;
    }

    function toggleCurrentRound() {
      state.roundOpen = !state.roundOpen;
      renderBoard();
    }

    function renderFinalLeaderboard() {
      const sortedTeams = sortTeamsByScore();
      const medals = ['🥇', '🥈', '🥉'];

      finalSection.innerHTML = `
        <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
        <div class="final-title">Миссия завершена!</div>
        <div class="final-subtitle">Итоговая таблица результатов космической экспедиции</div>

        ${
          sortedTeams.length === 0
            ? `<div class="empty-state">Экипажи не были добавлены.</div>`
            : `
              <div class="leaderboard">
                ${sortedTeams.map((team, index) => `
                  <div class="leaderboard-item ${index === 0 ? "leaderboard-item--1" : ""}">
                    <div class="leaderboard-place">${medals[index] || (index + 1)}</div>
                    <div class="leaderboard-name">${escapeHtml(team.name)}</div>
                    <div class="leaderboard-score">${team.score}</div>
                  </div>
                `).join("")}
              </div>
            `
        }
      `;
    }

    function render() {
      renderTeams();
      renderBoard();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !questionOverlay.classList.contains("hidden")) {
        closeQuestion();
      }
    });

    render();
  </script>
</body>
</html>
