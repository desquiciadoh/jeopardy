<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Своя Игра — День Космонавтики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #060a18;
      --bg-2: #0c1428;
      --bg-3: #08102a;
      --card: rgba(255, 255, 255, 0.035);
      --border: rgba(255, 255, 255, 0.07);
      --text: #d8dde8;
      --muted: rgba(180, 195, 225, 0.55);
      --gold: #e8c44a;
      --gold-2: #d4a520;
      --cyan: #5cc8e0;
      --purple: #8a6cd9;
      --pink: #d45aa8;
      --green: #27d67a;
      --red: #e85568;
      --star-blue: #6eadd4;
      --nebula: #6a50b8;
      --rocket-orange: #c87040;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 22px;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--bg-1);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== STAR FIELD ========== */
    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 1;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: var(--min-op); transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.15); }
    }

    /* ========== SHOOTING STARS ========== */
    .shooting-star {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: shoot 4s ease-in-out infinite;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.5), transparent);
      transform-origin: right center;
      transform: translateX(100%);
    }

    .shooting-star:nth-child(1) {
      top: 15%;
      left: 65%;
      animation-delay: 2s;
    }

    .shooting-star:nth-child(2) {
      top: 40%;
      left: 80%;
      animation-delay: 8s;
      animation-duration: 5s;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
      5% { opacity: 0.8; }
      12% { opacity: 0.8; transform: translate(-180px, 100px) rotate(-35deg); }
      18% { opacity: 0; transform: translate(-240px, 140px) rotate(-35deg); }
      100% { opacity: 0; }
    }

    /* ========== NEBULA BG ========== */
    .page-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      filter: blur(70px);
      background:
        radial-gradient(ellipse 700px 500px at 12% 18%, rgba(90, 60, 160, 0.28), transparent),
        radial-gradient(ellipse 600px 400px at 82% 22%, rgba(40, 80, 180, 0.22), transparent),
        radial-gradient(ellipse 500px 350px at 50% 80%, rgba(180, 120, 50, 0.15), transparent);
    }

    /* ========== PLANETS ========== */
    .planet {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .planet--earth {
      width: 200px;
      height: 200px;
      bottom: -60px;
      left: -70px;
      background: radial-gradient(circle at 35% 35%, #5a9ec4, #2a5a8a 50%, #1a3a6a 80%);
      box-shadow: 0 0 60px rgba(60, 140, 200, 0.18);
      opacity: 0.25;
      animation: float-planet 20s ease-in-out infinite;
    }

    .planet--small {
      width: 70px;
      height: 70px;
      top: 10%;
      right: 6%;
      background: radial-gradient(circle at 35% 35%, #d4a070, #9a6040 60%);
      box-shadow: 0 0 30px rgba(180, 110, 60, 0.12);
      opacity: 0.28;
      animation: float-planet 26s ease-in-out infinite reverse;
    }

    .planet--mid {
      width: 90px;
      height: 90px;
      top: 55%;
      left: 4%;
      background: radial-gradient(circle at 35% 35%, #e0c070, #b89030 60%, #907020 85%);
      box-shadow: 0 0 35px rgba(200, 160, 50, 0.10);
      opacity: 0.22;
      animation: float-planet 32s ease-in-out infinite;
    }

    /* Saturn ring */
    .planet--mid::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 32px;
      border: 1.5px solid rgba(224, 192, 112, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
    }

    @keyframes float-planet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    /* ========== ROCKETS ========== */
    .rocket {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 1.6rem;
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(255, 140, 60, 0.3));
    }

    .rocket--1 {
      animation: rocket-fly-1 28s linear infinite;
      animation-delay: 0s;
    }

    .rocket--2 {
      animation: rocket-fly-2 34s linear infinite;
      animation-delay: 10s;
    }

    @keyframes rocket-fly-1 {
      0% {
        bottom: -40px;
        left: 8%;
        opacity: 0;
        transform: rotate(-48deg) scale(0.9);
      }
      4% { opacity: 0.45; }
      85% { opacity: 0.45; }
      92% { opacity: 0; }
      100% {
        bottom: 105%;
        left: 65%;
        opacity: 0;
        transform: rotate(-48deg) scale(1);
      }
    }

    @keyframes rocket-fly-2 {
      0% {
        bottom: -40px;
        right: 12%;
        left: auto;
        opacity: 0;
        transform: rotate(-38deg) scale(0.85);
      }
      3% { opacity: 0.4; }
      80% { opacity: 0.4; }
      90% { opacity: 0; }
      100% {
        bottom: 108%;
        right: 60%;
        left: auto;
        opacity: 0;
        transform: rotate(-38deg) scale(1.05);
      }
    }

    /* ========== APP ========== */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      margin: 0 auto;
      padding: 24px 18px 56px;
    }

    /* ========== HERO ========== */
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(200, 112, 64, 0.08);
      border: 1px solid rgba(200, 112, 64, 0.18);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rocket-orange);
      margin-bottom: 16px;
    }

    .hero__title {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c8d0e8, var(--star-blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(92, 200, 224, 0.15));
    }

    .hero__uni {
      margin-top: 10px;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero__sub {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .hero__divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      color: rgba(92, 200, 224, 0.18);
      font-size: 0.55rem;
      letter-spacing: 0.6em;
      user-select: none;
    }

    .hero__divider::before,
    .hero__divider::after {
      content: '';
      flex: 1;
      max-width: 100px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(92, 200, 224, 0.10), transparent);
    }

    /* ========== PANELS ========== */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .teams-panel,
    .board-panel,
    .final-panel {
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .section-title__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--star-blue), var(--nebula));
      color: #fff;
      font-size: 1rem;
      opacity: 0.85;
    }

    .team-topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .team-add {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-add input {
      width: 240px;
      max-width: 100%;
      border: 1px solid rgba(92, 200, 224, 0.12);
      background: rgba(255,255,255,0.04);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-family: inherit;
      transition: 0.25s;
    }

    .team-add input:focus {
      border-color: rgba(92, 200, 224, 0.30);
      box-shadow: 0 0 0 3px rgba(92, 200, 224, 0.06);
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      transition: 0.22s ease;
    }

    .btn:hover {
      opacity: 0.90;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.40;
      cursor: not-allowed;
      transform: none;
    }

    .btn--main {
      background: linear-gradient(135deg, var(--star-blue), #3a7aaa);
      color: #fff;
      padding: 12px 18px;
    }

    .btn--soft {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .btn--gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1a1a1a;
      padding: 12px 18px;
    }

    .btn--green {
      background: linear-gradient(135deg, #30c878, #1a9a55);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--red {
      background: linear-gradient(135deg, #d86070, #b83a4a);
      color: #fff;
      padding: 13px 18px;
    }

    .btn--purple {
      background: linear-gradient(135deg, var(--nebula), var(--pink));
      color: #fff;
      padding: 13px 18px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
    }

    .team-card {
      background: linear-gradient(145deg, rgba(92, 200, 224, 0.03), rgba(106, 80, 184, 0.02));
      border: 1px solid rgba(92, 200, 224, 0.07);
      border-radius: 18px;
      padding: 18px;
      transition: 0.3s;
    }

    .team-card.active {
      border-color: rgba(92, 200, 224, 0.30);
      box-shadow: 0 0 0 1px rgba(92, 200, 224, 0.08), 0 14px 30px rgba(0,0,0,0.22);
    }

    .team-card__name {
      color: var(--cyan);
      font-size: 1.02rem;
      font-weight: 800;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .team-card__score {
      font-size: 2.2rem;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 16px;
    }

    .team-card__actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .team-card__actions .btn {
      flex: 1;
      min-height: 42px;
    }

    .team-card__bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .team-select-btn {
      flex: 1;
    }

    .team-remove-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      transition: 0.2s;
    }

    .team-remove-btn:hover {
      color: var(--red);
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 12px;
    }

    /* ========== ROUND STATUS ========== */
    .round-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(92, 200, 224, 0.03);
      border: 1px solid rgba(92, 200, 224, 0.08);
    }

    .round-status__left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .round-status__label {
      color: var(--muted);
      font-size: 0.80rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .round-status__title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .round-status__right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .round-accordion {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.015);
    }

    .round-accordion__body {
      padding: 16px;
    }

    .game-board {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .theme-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .theme-title {
      width: 180px;
      min-width: 180px;
      min-height: 112px;
      background: linear-gradient(135deg, rgba(106, 80, 184, 0.08), rgba(92, 200, 224, 0.06));
      border: 1px solid rgba(106, 80, 184, 0.14);
      border-radius: 16px;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--purple);
      text-align: center;
      line-height: 1.35;
      font-size: 0.92rem;
    }

    .theme-cells {
      display: flex;
      flex: 1;
      gap: 12px;
    }

    .question-cell {
      flex: 1;
      min-height: 112px;
      background: linear-gradient(145deg, rgba(232, 196, 74, 0.06), rgba(212, 165, 32, 0.02));
      border: 1px solid rgba(232, 196, 74, 0.12);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
      transition: 0.25s;
    }

    .question-cell:hover:not(.question-cell--used) {
      border-color: rgba(232, 196, 74, 0.25);
    }

    .question-cell--used {
      opacity: 0.22;
      pointer-events: none;
      background: rgba(255,255,255,0.015);
      border-color: rgba(255,255,255,0.03);
    }

    .question-cell__price {
      font-size: 1.75rem;
      color: var(--gold);
      font-weight: 900;
    }

    .question-cell__play {
      min-width: 92px;
      padding: 8px 12px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .board-hint {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 0.90rem;
    }

    .board-hint strong {
      color: var(--cyan);
    }

    /* ========== QUESTION MODAL ========== */
    .question-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(4, 6, 16, 0.80);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .question-modal {
      width: 100%;
      max-width: 860px;
      background: linear-gradient(145deg, rgba(10, 18, 40, 0.97), rgba(6, 10, 26, 0.98));
      border: 1px solid rgba(92, 200, 224, 0.10);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.50);
      padding: 34px 30px 28px;
    }

    .question-modal__top {
      text-align: center;
      margin-bottom: 24px;
    }

    .question-modal__theme {
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .question-modal__price {
      color: var(--gold);
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .question-modal__team {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      background: rgba(92, 200, 224, 0.05);
      border-radius: 999px;
      border: 1px solid rgba(92, 200, 224, 0.08);
      font-size: 0.90rem;
      color: var(--muted);
    }

    .question-modal__team strong {
      color: var(--cyan);
    }

    .question-modal__text {
      text-align: center;
      font-size: 1.4rem;
      line-height: 1.65;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .answer-box {
      display: none;
      margin-bottom: 24px;
      text-align: center;
      background: rgba(39, 180, 100, 0.06);
      border: 1px solid rgba(39, 180, 100, 0.18);
      color: #a0e0be;
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .answer-box.visible {
      display: block;
    }

    .question-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .question-actions .btn {
      min-height: 52px;
      font-size: 0.96rem;
    }

    /* ========== FINAL ========== */
    .final-panel {
      text-align: center;
    }

    .final-title {
      font-size: 1.9rem;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--gold), var(--rocket-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .final-subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .leaderboard {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.05);
    }

    .leaderboard-item--1 {
      border-color: rgba(232, 196, 74, 0.30);
      box-shadow: 0 0 0 1px rgba(232, 196, 74, 0.10);
      background: linear-gradient(145deg, rgba(232, 196, 74, 0.04), rgba(212, 165, 32, 0.02));
    }

    .leaderboard-place {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
    }

    .leaderboard-name {
      text-align: left;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--cyan);
      word-break: break-word;
    }

    .leaderboard-score {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .theme-row {
        flex-direction: column;
      }

      .theme-title {
        width: 100%;
        min-width: 100%;
      }

      .theme-cells {
        flex-wrap: wrap;
      }

      .question-cell {
        min-width: calc(50% - 6px);
        flex: unset;
      }

      .question-actions {
        grid-template-columns: 1fr;
      }

      .planet--small {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 14px 12px 40px;
      }

      .teams-panel,
      .board-panel,
      .final-panel {
        padding: 18px;
      }

      .team-add {
        width: 100%;
      }

      .team-add input,
      .team-add .btn {
        width: 100%;
      }

      .question-modal {
        padding: 26px 18px 20px;
      }

      .question-modal__text {
        font-size: 1.12rem;
      }

      .question-modal__price {
        font-size: 2.2rem;
      }

      .leaderboard-item {
        grid-template-columns: 56px 1fr 90px;
        gap: 10px;
        padding: 14px;
      }

      .leaderboard-score {
        font-size: 1.2rem;
      }

      .planet--earth {
        width: 130px;
        height: 130px;
      }

      .planet--mid {
        display: none;
      }
    }
  </style>

  <div class="starfield" id="starfield"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="page-bg"></div>

  <div class="planet planet--earth"></div>
  <div class="planet planet--small"></div>

  <script>
    const state = {
      teams: [],
      selectedTeamId: null,
      currentRoundIndex: 0,
      roundOpen: true,
      activeQuestion: null,
      usedQuestions: new Set(),
      gameFinished: false,
      answerShown: false
    };

    const teamsSection = document.getElementById("teams-section");
    const boardSection = document.getElementById("board-section");
    const questionOverlay = document.getElementById("question-overlay");
    const finalSection = document.getElementById("final-section");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getQuestionKey(ri, ti, qi) {
      return `${ri}-${ti}-${qi}`;
    }

    function isQuestionUsed(ri, ti, qi) {
      return state.usedQuestions.has(getQuestionKey(ri, ti, qi));
    }

    function isRoundCompleted(ri) {
      const round = GAME_CONFIG.rounds[ri];
      for (let t = 0; t < round.themes.length; t++) {
        for (let q = 0; q < round.themes[t].questions.length; q++) {
          if (!isQuestionUsed(ri, t, q)) return false;
        }
      }
      return true;
    }

    function getCurrentRound() {
      return GAME_CONFIG.rounds[state.currentRoundIndex];
    }

    function getRemainingQuestionsInRound(ri) {
      const round = GAME_CONFIG.rounds[ri];
      let total = 0;
      round.themes.forEach((theme, ti) => {
        theme.questions.forEach((_, qi) => {
          if (!isQuestionUsed(ri, ti, qi)) total++;
        });
      });
      return total;
    }

    function sortTeamsByScore() {
      return [...state.teams].sort((a, b) => b.score - a.score);
    }

    function addTeam() {
      const input = document.getElementById("team-name-input");
      if (!input) return;
      const name = input.value.trim();
      if (!name) return;
      state.teams.push({ id: Date.now() + Math.random(), name, score: 0 });
      if (state.selectedTeamId === null) state.selectedTeamId = state.teams[0].id;
      input.value = "";
      render();
    }

    function removeTeam(teamId) {
      const team = state.teams.find(t => t.id === teamId);
      if (!team || !confirm(`Удалить экипаж «${team.name}»?`)) return;
      state.teams = state.teams.filter(t => t.id !== teamId);
      if (state.selectedTeamId === teamId)
        state.selectedTeamId = state.teams.length ? state.teams[0].id : null;
      render();
    }

    function changeTeamScore(teamId, amount) {
      const team = state.teams.find(t => t.id === teamId);
      if (team) { team.score += amount; renderTeams(); }
    }

    function selectTeam(teamId) {
      state.selectedTeamId = teamId;
      renderTeams();
      renderBoard();
    }

    function openQuestion(ri, ti, qi) {
      if (state.gameFinished) return;
      if (state.selectedTeamId === null) { alert("Сначала выберите экипаж."); return; }
      if (state.usedQuestions.has(getQuestionKey(ri, ti, qi))) return;
      const round = GAME_CONFIG.rounds[ri];
      const theme = round.themes[ti];
      const question = theme.questions[qi];
      const team = state.teams.find(t => t.id === state.selectedTeamId);
      state.activeQuestion = { roundIndex: ri, themeIndex: ti, questionIndex: qi, question, themeName: theme.name, teamId: team ? team.id : null };
      state.answerShown = false;
      questionOverlay.classList.remove("hidden");
      renderQuestionModal();
    }

    function closeQuestion() {
      state.activeQuestion = null;
      state.answerShown = false;
      questionOverlay.classList.add("hidden");
      questionOverlay.innerHTML = "";
    }

    function showAnswer() {
      state.answerShown = true;
      renderQuestionModal();
    }

    function renderQuestionModal() {
      if (!state.activeQuestion) return;
      const activeTeam = state.teams.find(t => t.id === state.activeQuestion.teamId);
      const { question, themeName } = state.activeQuestion;
      questionOverlay.innerHTML = `
        <div class="question-modal">
          <div class="question-modal__top">
            <div class="question-modal__theme">${escapeHtml(themeName)}</div>
            <div class="question-modal__price">${question.price}</div>
            <div class="question-modal__team">
              <span>Отвечает:</span>
              <strong>${activeTeam ? escapeHtml(activeTeam.name) : "—"}</strong>
            </div>
          </div>
          <div class="question-modal__text">${escapeHtml(question.question)}</div>
          <div class="answer-box ${state.answerShown ? "visible" : ""}">${escapeHtml(question.answer)}</div>
          <div class="question-actions">
            ${state.answerShown
              ? `<button class="btn btn--green" onclick="handleCorrectAnswer()">Верно</button>
                 <button class="btn btn--red" onclick="handleWrongAnswer()">Неверно</button>`
              : `<button class="btn btn--purple" onclick="showAnswer()">Показать ответ</button>
                 <button class="btn btn--soft" onclick="closeQuestion()">Назад</button>`}
          </div>
        </div>`;
    }

    function markQuestionAsUsed() {
      const { roundIndex, themeIndex, questionIndex } = state.activeQuestion;
      state.usedQuestions.add(getQuestionKey(roundIndex, themeIndex, questionIndex));
    }

    function handleCorrectAnswer() {
      if (!state.activeQuestion) return;
      const team = state.teams.find(t => t.id === state.activeQuestion.teamId);
      if (team) team.score += state.activeQuestion.question.price;
      markQuestionAsUsed();
      proceedAfterAnswer();
    }

    function handleWrongAnswer() {
      if (!state.activeQuestion) return;
      const team = state.teams.find(t => t.id === state.activeQuestion.teamId);
      if (team) team.score -= state.activeQuestion.question.price;
      markQuestionAsUsed();
      proceedAfterAnswer();
    }

    function proceedAfterAnswer() {
      const ri = state.activeQuestion.roundIndex;
      closeQuestion();
      if (isRoundCompleted(ri)) {
        if (ri < GAME_CONFIG.rounds.length - 1) {
          state.currentRoundIndex = ri + 1;
          state.roundOpen = true;
        } else { finishGame(); return; }
      }
      render();
    }

    function finishGame() {
      state.gameFinished = true;
      state.roundOpen = false;
      teamsSection.classList.add("hidden");
      boardSection.classList.add("hidden");
      renderFinalLeaderboard();
      finalSection.classList.remove("hidden");
    }

    function renderTeams() {
      if (state.gameFinished) return;
      teamsSection.innerHTML = `
        <div class="team-topbar">
          <div>
            <h2 class="section-title">
              <span class="section-title__icon">★</span>
              Экипажи
            </h2>
          </div>
          <div class="team-add">
            <input id="team-name-input" type="text" placeholder="Название экипажа" onkeydown="if(event.key==='Enter')addTeam()" />
            <button class="btn btn--main" onclick="addTeam()">Добавить</button>
          </div>
        </div>
        ${state.teams.length === 0
          ? `<div class="empty-state">Добавьте экипажи и выберите отвечающий.</div>`
          : `<div class="teams-grid">${state.teams.map(team => `
              <div class="team-card ${state.selectedTeamId === team.id ? "active" : ""}">
                <div class="team-card__name">${escapeHtml(team.name)}</div>
                <div class="team-card__score">${team.score}</div>
                <div class="team-card__actions">
                  <button class="btn btn--red" onclick="changeTeamScore(${team.id},-100)">−100</button>
                  <button class="btn btn--green" onclick="changeTeamScore(${team.id},100)">+100</button>
                </div>
                <div class="team-card__bottom">
                  <button class="btn btn--gold team-select-btn" onclick="selectTeam(${team.id})">
                    ${state.selectedTeamId === team.id ? "Отвечает" : "Выбрать"}
                  </button>
                  <button class="team-remove-btn" onclick="removeTeam(${team.id})">удалить</button>
                </div>
              </div>`).join("")}</div>`}`;
    }

    function renderBoard() {
      if (state.gameFinished) return;
      const round = getCurrentRound();
      const remaining = getRemainingQuestionsInRound(state.currentRoundIndex);
      const sel = state.teams.find(t => t.id === state.selectedTeamId);
      boardSection.innerHTML = `
        <div class="round-status">
          <div class="round-status__left">
            <div class="round-status__label">Активный этап</div>
            <div class="round-status__title">${escapeHtml(round.name)}</div>
          </div>
          <div class="round-status__right">
            <span>Осталось: ${remaining}</span>
            <button class="btn btn--soft" onclick="toggleCurrentRound()">${state.roundOpen ? "Скрыть" : "Раскрыть"}</button>
          </div>
        </div>
        ${state.roundOpen ? `
          <div class="round-accordion"><div class="round-accordion__body"><div class="game-board">
            ${round.themes.map((theme, ti) => `
              <div class="theme-row">
                <div class="theme-title">${escapeHtml(theme.name)}</div>
                <div class="theme-cells">
                  ${theme.questions.map((q, qi) => {
                    const used = isQuestionUsed(state.currentRoundIndex, ti, qi);
                    return `<div class="question-cell ${used ? "question-cell--used" : ""}">
                      <div class="question-cell__price">${q.price}</div>
                      <button class="btn btn--gold question-cell__play" ${used ? "disabled" : ""} onclick="openQuestion(${state.currentRoundIndex},${ti},${qi})">Играть</button>
                    </div>`;
                  }).join("")}
                </div>
              </div>`).join("")}
          </div></div></div>` : ""}
        <div class="board-hint">${sel ? `Отвечает: <strong>${escapeHtml(sel.name)}</strong>` : `Выберите <strong>отвечающий экипаж</strong> выше`}</div>`;
    }

    function toggleCurrentRound() {
      state.roundOpen = !state.roundOpen;
      renderBoard();
    }

    function renderFinalLeaderboard() {
      const sorted = sortTeamsByScore();
      finalSection.innerHTML = `
        <div class="final-title">Миссия завершена</div>
        <div class="final-subtitle">Итоговая таблица результатов</div>
        ${sorted.length === 0 ? `<div class="empty-state">Экипажи не добавлены.</div>` : `
          <div class="leaderboard">${sorted.map((team, i) => `
            <div class="leaderboard-item ${i === 0 ? "leaderboard-item--1" : ""}">
              <div class="leaderboard-place">${i + 1}</div>
              <div class="leaderboard-name">${escapeHtml(team.name)}</div>
              <div class="leaderboard-score">${team.score}</div>
            </div>`).join("")}</div>`}`;
    }

    function render() { renderTeams(); renderBoard(); }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !questionOverlay.classList.contains("hidden")) closeQuestion();
    });

    render();
  </script>
